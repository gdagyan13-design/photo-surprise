<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Surprise</title>
</head>

<body>
  <h2>📸 Photo Surprise</h2>
  <p>بۆ وێنەگرتن، سەرەتا ڕێگە بە کامێرا بدە.</p>

  <video id="camera" autoplay playsinline width="100%"></video>
  <br><br>

  <button id="start">کامێرا بکەرەوە</button>
  <button id="take" disabled>وێنە بگرە</button>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const camera = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const start = document.getElementById("start");
    const take = document.getElementById("take");

    let stream;

    start.onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: true
        });

        camera.srcObject = stream;
        take.disabled = false;
      } catch (error) {
        alert("ڕێگەدان بە کامێرا پێویستە.");
      }
    };

    take.onclick = () => {
      canvas.width = camera.videoWidth;
      canvas.height = camera.videoHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(
        camera,
        0,
        0,
        canvas.width,
        canvas.height
      );

      alert("وێنەکە بە سەرکەوتوویی گیرا ✅");
    };
  </script>
</body>
</html>
